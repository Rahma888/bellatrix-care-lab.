<body>
<div id="app">
  <div id="fit">
    <div class="stage" id="stage">
      <div class="top" id="top">
        <span class="facechip" id="faceMini" aria-hidden="true"></span>
        <span class="chip" id="chipPreview" hidden>Preview</span>
        <span class="chip" id="chipCam" hidden><span class="dot cam"></span><span id="camText">Camera on · not recorded</span></span>
        <span class="chip" id="chipMic" hidden><span class="dot mic"></span><span id="micText">Listening</span></span>
        <span class="chip" id="chipHeard" hidden><span id="heardText"></span></span>
        <span class="chip" id="chipHand" hidden><span id="handText"></span></span>
        <div class="bar" id="holdBar" hidden><i id="holdFill"></i></div>
      </div>
      <p class="caption" id="caption" hidden aria-live="polite"></p>
      <div id="screen"></div>
      <div class="aircursor" id="airCursor" hidden aria-hidden="true"><i></i></div>
    </div>
  </div>
</div>
<video id="cam" playsinline muted></video>

<div id="staffpanel" hidden>
  <h3>Staff panel</h3>
  <div id="pinfo" class="note"></div>
  <div id="pcounts"></div>
  <div class="row">
    <button type="button" id="pAttempt">Attempt seen (A)</button>
    <button type="button" id="staffTap">Staff is tapping: off</button>
    <button type="button" id="pEnd">End session (Esc)</button>
    <button type="button" id="pHide">Hide (L)</button>
    <button type="button" id="pCam">Camera (C)</button>
  </div>
  <ol id="plog"></ol>
</div>
<div id="toast" hidden></div>
