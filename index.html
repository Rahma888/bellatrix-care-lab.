<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellatrix</title>
<link rel="stylesheet" href="vendor/fonts/atkinson.css?v=1.16.0">
<link rel="stylesheet" href="css/lab.css?v=1.16.0">
<link rel="stylesheet" href="css/brand.css?v=1.16.0">
<style>
  .launch { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .launch .box { width: min(100%, 720px); }
  .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .apps a { display: flex; flex-direction: column; gap: 6px; padding: 22px; border-radius: 16px; border: 2px solid var(--accent); text-decoration: none; color: var(--ink); background: var(--surface); }
  .apps a b { font-size: 22px; color: var(--accent); }
  .apps a.patient { background: var(--accent); color: var(--on-accent); }
  .apps a.patient b { color: var(--on-accent); }
</style>
</head>
<body>
<section class="setup launch">
  <div class="box">
    <h1>Bellatrix</h1>
    <p class="note">Two apps on one device. They share the patients, the pictures, the songs and the results.</p>
    <div class="apps">
      <a href="staff.html" id="toStaff"><b>Care team</b><span>Choose the patient and the activity, personalise everything, read the results.</span></a>
      <a href="patient.html" id="toPatient" class="patient"><b>Patient</b><span>Only the activities, on the robot’s screen.</span></a>
    </div>
  </div>
</section>
<script>
  /* Keep ?robot=1 (full screen, screen stays awake) when moving on to either app. */
  ['toStaff', 'toPatient'].forEach(function (id) { var a = document.getElementById(id); a.href += location.search; });
</script>
</body>
</html>
